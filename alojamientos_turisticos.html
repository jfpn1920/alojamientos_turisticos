<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alojamientos_turisticos</title>
    <link rel="stylesheet" href="alojamientos_turisticos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="alojamientos_turisticos.js" defer></script>
</head>
<body>
    <!-------------------------------------------->
    <!--|estructuracion_alojamientos_turisticos|-->
    <!-------------------------------------------->
    <header class="encabezado">
        <h1>Alojamientos Turísticos</h1>
        <p>Encuentra el alojamiento ideal para tu próximo viaje</p>
    </header>

    <main class="contenedor_principal">
        <section class="seccion_formulario">
            <h2>Agregar alojamiento</h2>

            <form id="formulario_alojamiento">
                <div class="campo_formulario">
                    <label for="nombre_alojamiento">Nombre</label>
                    <input type="text" id="nombre_alojamiento" required>
                </div>

                <div class="campo_formulario">
                    <label for="ubicacion_alojamiento">Ubicación</label>
                    <input type="text" id="ubicacion_alojamiento" required>
                </div>

                <div class="campo_formulario">
                    <label for="precio_alojamiento">Precio por noche</label>
                    <input type="number" id="precio_alojamiento" required>
                </div>

                <div class="campo_formulario">
                    <label for="imagen_alojamiento">URL de imagen</label>
                    <input type="url" id="imagen_alojamiento" required>
                </div>

                <button type="submit" class="boton_agregar">
                    Agregar alojamiento
                </button>
            </form>
        </section>

        <section class="seccion_alojamientos">
            <div class="encabezado_alojamientos">
                <h2>Alojamientos disponibles</h2>
                <span id="contador_alojamientos">0 alojamientos</span>
            </div>

            <div id="contenedor_tarjetas" class="contenedor_tarjetas">
            </div>
        </section>
    </main>
</body>
</html>
